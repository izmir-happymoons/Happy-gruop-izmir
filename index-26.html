<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213f">
<title>İzmir Optimum Happy Moon’s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #14213f;
    --night-deep: #0e1830;
    --moon: #f6e7a8;
    --moon-soft: #e9d98f;
    --mist: #b9c4e0;
    --row-mola: #1f3a6b;
    --row-servis: #2b2f66;
    --row-skt: #1c4a5c;
    --line: rgba(246, 231, 168, 0.22);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--night);
    color: var(--moon);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }

  /* Ay: sayfadaki tek dikkat çekici öğe */
  .moon {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: var(--moon);
    position: relative;
    overflow: hidden;
    margin: 12px 0 28px;
    box-shadow: 0 0 60px rgba(246, 231, 168, 0.28);
  }
  .moon::after {
    content: "";
    position: absolute;
    width: 118px;
    height: 118px;
    border-radius: 50%;
    background: var(--night);
    top: -14px;
    left: 40px;
  }

  h1 {
    font-size: clamp(2.4rem, 11vw, 3.4rem);
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  .sub {
    margin: 0 0 32px;
    color: var(--mist);
    font-size: 1.02rem;
    max-width: 34ch;
  }

  .apps { display: grid; gap: 12px; }
  .app {
    display: grid;
    grid-template-columns: 56px 1fr 14px;
    align-items: center;
    gap: 16px;
    padding: 18px 18px 18px 16px;
    border-radius: 22px;
    color: var(--moon);
    text-decoration: none;
    border: 1px solid var(--line);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .app:active { transform: scale(0.98); }
  .app:hover { border-color: var(--moon-soft); }
  .app:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }
  .app.mola { background: var(--row-mola); }
  .app.servis { background: var(--row-servis); }
  .app.skt  { background: var(--row-skt); }

  .glyph {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--night-deep);
    display: grid;
    place-items: center;
  }
  .glyph svg { width: 28px; height: 28px; stroke: var(--moon); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .app h2 { margin: 0; font-size: 1.28rem; font-weight: 600; }
  .app p { margin: 2px 0 0; color: var(--mist); font-size: 0.92rem; }
  .chev {
    width: 10px;
    height: 10px;
    border-right: 2.5px solid var(--moon-soft);
    border-top: 2.5px solid var(--moon-soft);
    transform: rotate(45deg);
    justify-self: end;
  }

  footer {
    margin-top: 36px;
    color: var(--mist);
    font-size: 0.88rem;
    opacity: 0.85;
  }

  .lock { justify-self: end; display: grid; }
  .lock svg { width: 18px; height: 18px; stroke: var(--moon-soft); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .gate {
    position: fixed;
    inset: 0;
    background: rgba(8, 14, 30, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .gate.open { display: flex; }
  .gate-box {
    width: 100%;
    max-width: 340px;
    background: var(--night);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 24px 22px 20px;
  }
  .gate-box h3 { margin: 0 0 4px; font-size: 1.3rem; font-weight: 600; }
  .gate-box p { margin: 0 0 16px; color: var(--mist); font-size: 0.92rem; }
  .gate-box input {
    width: 100%;
    font: inherit;
    font-size: 1.4rem;
    letter-spacing: 0.3em;
    text-align: center;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--night-deep);
    color: var(--moon);
  }
  .gate-box input:focus-visible { outline: 3px solid var(--moon); outline-offset: 2px; }
  .gate-err { min-height: 1.3em; margin: 8px 0 0; color: #ffb4a8; font-size: 0.9rem; }
  .gate-actions { display: flex; gap: 10px; margin-top: 8px; }
  .gate-actions button {
    flex: 1;
    font: inherit;
    font-weight: 600;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .gate-cancel { background: transparent; color: var(--moon); }
  .gate-ok { background: var(--moon); color: var(--night); border-color: var(--moon); }

  @media (prefers-reduced-motion: reduce) {
    .app { transition: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="moon" role="img" aria-label="Hilal"></div>
  <h1>İzmir Optimum Happy Moon’s</h1>
  <p class="sub">Ekibin bütün uygulamaları burada. Açmak istediğine dokun.</p>

  <nav class="apps" aria-label="Uygulamalar">

    <!-- LİNKLER: adresi değişirse sadece href kısmını güncelle -->
    <a class="app mola" href="https://kadirkarakadgrup-beep.github.io/Mola-takip/">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M16 11h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M8 3v2M12 3v2"/></svg>
      </span>
      <span>
        <h2>Mola Takip</h2>
        <p>Molanı başlat, süreni takip et</p>
      </span>
      <span class="chev" aria-hidden="true"></span>
    </a>

    <a class="app servis" data-lock="1" href="https://kadirkarakadgrup-beep.github.io/servis-takip/">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/></svg>
      </span>
      <span>
        <h2>Servis Takip</h2>
        <p>Servis güzergahlarını takip et</p>
      </span>
      <span class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    </a>

    <a class="app skt" data-lock="1" href="https://kadirkarakadgrup-beep.github.io/bar-skt/">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </span>
      <span>
        <h2>Bar SKT Takip</h2>
        <p>Bar ürünlerinin son kullanma tarihleri</p>
      </span>
      <span class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    </a>

  </nav>

</main>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="gate-box">
    <h3 id="gate-title">Şifre gerekli</h3>
    <p id="gate-name"></p>
    <input id="gate-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Şifre">
    <div class="gate-err" id="gate-err" role="alert"></div>
    <div class="gate-actions">
      <button type="button" class="gate-cancel" id="gate-cancel">Vazgeç</button>
      <button type="button" class="gate-ok" id="gate-ok">Gir</button>
    </div>
  </div>
</div>

<script>
(function () {
  // Şifreyi değiştirmek için sadece bu satırı güncelle
  var PASSWORD = "2017";
  var KEY = "hm-unlocked";

  var gate = document.getElementById("gate");
  var input = document.getElementById("gate-input");
  var err = document.getElementById("gate-err");
  var nameEl = document.getElementById("gate-name");
  var target = null;

  function isUnlocked() {
    try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; }
  }
  function remember() {
    try { localStorage.setItem(KEY, "1"); } catch (e) {}
  }
  function openGate(link) {
    target = link;
    nameEl.textContent = link.querySelector("h2").textContent + " için şifreyi gir.";
    input.value = "";
    err.textContent = "";
    gate.classList.add("open");
    setTimeout(function () { input.focus(); }, 50);
  }
  function closeGate() {
    gate.classList.remove("open");
    target = null;
  }
  function submit() {
    if (input.value === PASSWORD) {
      remember();
      var href = target.href;
      closeGate();
      window.location.href = href;
    } else {
      err.textContent = "Şifre yanlış, tekrar dene.";
      input.value = "";
      input.focus();
    }
  }

  var links = document.querySelectorAll("a[data-lock]");
  for (var i = 0; i < links.length; i++) {
    links[i].addEventListener("click", function (e) {
      if (isUnlocked()) return;
      e.preventDefault();
      openGate(this);
    });
  }
  document.getElementById("gate-ok").addEventListener("click", submit);
  document.getElementById("gate-cancel").addEventListener("click", closeGate);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  gate.addEventListener("click", function (e) { if (e.target === gate) closeGate(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeGate(); });
})();
</script>
</body>
</html>
